          >= 0) and on(job,instance) (time()-ci_storage_observed_timestamp_seconds{job="wk01",instance="wk01",exporter="node"}
          <= 90)) and on(job,instance) (ci_storage_artifact_valid{job="wk01",instance="wk01",exporter="node"}
          == 1)) * on() group_left() ((sum(ci_pool_queue_waiting_jobs{job="wk01",instance="wk01",exporter="node"})
          > bool 0) and (sum(ci_pool_queue_valid{job="wk01",instance="wk01",exporter="node"})
