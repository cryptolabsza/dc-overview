# TRACEWEAVER: file-role=gpu-alert-behavior; req=REQ-GPUALERT-002; trace=TRACE-GPUALERT-002; ver=VER-GPUALERT-002
# Concise notification templates for DC Overview-managed alerts.
apiVersion: 1

templates:
  - orgId: 1
    name: dc-overview-notifications
    template: |
      {{ define "cryptolabs.telegram.message" }}
      {{ with .Alerts.Firing }}
      {{ range . }}
      {{ if eq .Labels.alert_category "gpu_collection" }}🟠 {{ .Annotations.summary }}
      {{ .Annotations.description }}
      {{ else }}🔴 FIRING
      {{ if eq .Labels.alert_category "vast_listing" }}Vast UNLISTED — {{ .Annotations.summary }}
      {{ else }}
      {{ .Annotations.summary }}
      {{ .Annotations.description }}
      {{ end }}
      {{ end }}
      {{ end }}
      {{ end }}
      {{ with .Alerts.Resolved }}
      {{ range . }}
      {{ if eq .Labels.alert_category "gpu_collection" }}
      {{ if .Annotations.grafana_state_reason }}🟠 GPU monitoring changed ({{ .Annotations.grafana_state_reason }}) — {{ .Annotations.summary }}
      {{ else }}🟢 {{ .Annotations.recovery_summary }}
      {{ end }}
      {{ else }}🟢 RESOLVED
      {{ if eq .Labels.alert_category "vast_listing" }}
      {{ if .Annotations.grafana_state_reason }}Vast listing monitoring changed ({{ .Annotations.grafana_state_reason }}) — {{ .Annotations.summary }}
      {{ else }}Vast LISTED — {{ .Annotations.summary }}
      {{ end }}
      {{ else }}
      {{ .Annotations.summary }}
      {{ .Annotations.description }}
      {{ end }}
      {{ end }}
      {{ end }}
      {{ end }}
      {{ end }}
