name: Immutable main image release preflight
'on':
  workflow_call:
    outputs:
      build:
        value: ${{ jobs.metadata.outputs.build }}
      status:
        value: ${{ jobs.metadata.outputs.status }}
permissions:
  contents: read
  packages: read
jobs:
  metadata:
    if: github.repository_id == '1133295682' && github.ref_protected == true && github.ref == 'refs/heads/main' && (github.event_name
      == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: ci-publish-ephemeral
      labels:
      - ci-linux-publish-v1-r1133295682
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout only frozen reviewed image helpers
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cryptolabsza/dc-overview
        ref: 'de12ba00b06b5804b26a86453e5d1c2eb142c805'
        persist-credentials: false
        fetch-depth: 1
        path: publisher
        sparse-checkout: '/.github/image-publisher/bootstrap_tools.py

          /.github/image-publisher/image_promotion.py

          /.github/image-publisher/image_publisher.py

          /.github/image-publisher/policy.py

          /.github/image-publisher/tools.json

          /.github/image-publisher/transport.py

          /.github/image-publisher/verify_artifact.py

          '
        sparse-checkout-cone-mode: false
    - name: Verify frozen upstream verifier and OCI parser
      run: 'echo ''54bd08ddf7e59e755c0f21b3413699459cb837d152ff4b57716660f2ff71c7c3  publisher/.github/image-publisher/verify_artifact.py''
        | sha256sum --check -

        echo ''ef55392ffcdf59a30a232c436520e10b318a3895e139f0c40904e33f7dccd2a8  publisher/.github/image-publisher/image_publisher.py''
        | sha256sum --check -

        '
    - name: Install verified normal-user official tools
      run: python3 publisher/.github/image-publisher/bootstrap_tools.py
    - name: Retain original protected-main discovery guard
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 publisher/.github/image-publisher/policy.py preflight
      id: metadata
    - name: Retain release identity receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: image-release-preflight-receipt
        path: ${{ runner.temp }}/image-release-preflight-receipt.json
        if-no-files-found: warn
        retention-days: 90
    outputs:
      build: ${{ steps.metadata.outputs.build }}
      status: ${{ steps.metadata.outputs.status }}
