name: Promote tested image aliases
permissions:
  contents: read
concurrency:
  group: image-alias-promotion-${{ github.repository }}
  cancel-in-progress: false
jobs:
  promote:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-promote-recipe.yml@98fc1d4be4e4a091cad8b5d5a2d5b3b7c5c57225
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      release_tag: ${{ inputs.release_tag }}
      source_sha: ${{ inputs.source_sha }}
      dc_overview_digest: ${{ inputs.dc_overview_digest }}
      runpod_exporter_digest: ${{ inputs.runpod_exporter_digest }}
      vastai_exporter_digest: ${{ inputs.vastai_exporter_digest }}
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published numeric release tag whose immutable images passed all customer gates
        required: true
        type: string
      source_sha:
        description: Exact full source commit of the tested release
        required: true
        type: string
      dc_overview_digest:
        description: Exact tested dc-overview manifest/index digest (sha256:...)
        required: true
        type: string
      runpod_exporter_digest:
        description: Exact tested runpod-exporter manifest/index digest (sha256:...)
        required: true
        type: string
      vastai_exporter_digest:
        description: Exact tested vastai-exporter manifest/index digest (sha256:...)
        required: true
        type: string
