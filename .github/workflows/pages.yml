name: Deploy Documentation to GitHub Pages
'on':
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-pages-build-recipe.yml@5d7b7f894f958cf847c71408a143be89510b8391
    permissions:
      contents: read
  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && github.ref_protected == true
    uses: cryptolabsza/dc-overview/.github/workflows/ci-pages-publish-recipe.yml@f1b9b6fbd92b67f9f67ba3eec8e4c7cef2e0ddff
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
