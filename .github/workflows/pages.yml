name: Deploy Documentation to GitHub Pages
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-pages-build-recipe.yml@f995901eb7fbb1bf6d94fd75d1a8b69d8edfdcef
    permissions:
      contents: read
  build-and-deploy:
    runs-on:
    - self-hosted
    - ci-authority-held-r1133295682
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Setup Pages
      uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d
      with:
        enablement: true
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      with:
        source: ./docs
        destination: ./_site
    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
    timeout-minutes: 45
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
'on':
  push:
    branches:
    - dev
    - main
    paths:
    - docs/**
    - .github/workflows/pages.yml
  workflow_dispatch: null
  pull_request:
    branches:
    - dev
    - main
