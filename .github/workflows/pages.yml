name: Deploy Documentation to GitHub Pages
'on':
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-pages-build-recipe.yml@751d216a4e7eb37c0286177601ed8f01f84a6034
    permissions:
      contents: read
  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && github.ref_protected == true
    uses: cryptolabsza/dc-overview/.github/workflows/ci-pages-publish-recipe.yml@a46fe6681498cca8c8f1dfef4046d31b9fe2983e
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
