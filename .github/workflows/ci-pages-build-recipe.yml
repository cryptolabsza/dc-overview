name: Read-only Pages site build recipe
'on':
  workflow_call:
    outputs:
      artifact_id:
        description: Immutable Pages artifact ID
        value: ${{ jobs.build.outputs.artifact_id }}
permissions:
  contents: read
jobs:
  build:
    if: github.repository_id == '1133295682' && (((github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') && github.ref_protected == true &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.id == 1133295682 &&
      (github.base_ref == 'dev' || github.base_ref == 'main')))
    runs-on:
      group: ci-build-public-ephemeral
      labels:
      - ci-linux-cpu-v1-r1133295682
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - name: Checkout exact source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up managed Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Verify Pages source contracts
      run: 'python -m pip install --quiet PyYAML==6.0.3

        python -m unittest discover -s .github/pages-tests -v'
    - name: Verify public admission and source contracts
      run: python -m unittest discover -s .github/tests -p 'test_ci_public_route.py'
        -v
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      with:
        source: ./docs
        destination: ./_site
    - name: Upload immutable site data
      id: upload
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        name: pages-site-${{ github.run_id }}-${{ github.run_attempt }}
        path: _site/
        retention-days: 7
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
