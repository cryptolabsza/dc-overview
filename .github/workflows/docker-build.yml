name: Build and Push Docker Image
concurrency:
  group: image-release-publication-${{ github.repository }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref
    }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  release-preflight:
    if: github.event_name != 'pull_request'
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-preflight-recipe.yml@8ff3429c6687b0d381cb3e961de30563cccb43e6
    permissions:
      contents: read
      packages: read
  build:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-build-recipe.yml@ecae2f5057fd75d2af2e79ea2b55b102c689ab38
    permissions:
      contents: read
  publish-build:
    if: github.event_name != 'pull_request'
    needs:
    - build
    - release-preflight
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-publish-recipe.yml@106b38e568fae2bebea48a0ecb7fddd7e8f5bf4d
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
  release-readback:
    if: always() && needs.release-preflight.result == 'success'
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-readback-recipe.yml@8ff3429c6687b0d381cb3e961de30563cccb43e6
    permissions:
      contents: read
      packages: read
    needs:
    - release-preflight
    - publish-build
'on':
  push:
    branches:
    - main
    - master
    - develop
    - dev
    tags:
    - v*
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
