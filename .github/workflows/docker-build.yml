name: Build and Push Docker Image
concurrency:
  group: image-release-publication-${{ github.repository }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref
    }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  release-preflight:
    if: github.event_name != 'pull_request'
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-preflight-recipe.yml@98fc1d4be4e4a091cad8b5d5a2d5b3b7c5c57225
    permissions:
      contents: read
      packages: read
  build:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-build-recipe.yml@3561d105715442e7b029b885304aab82d96204fe
    permissions:
      contents: read
  publish-build:
    if: github.event_name != 'pull_request'
    needs:
    - build
    - release-preflight
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-publish-recipe.yml@98fc1d4be4e4a091cad8b5d5a2d5b3b7c5c57225
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
  build-runpod-exporter:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-build-runpod-exporter-recipe.yml@f995901eb7fbb1bf6d94fd75d1a8b69d8edfdcef
    permissions:
      contents: read
  build-vastai-exporter:
    uses: cryptolabsza/dc-overview/.github/workflows/ci-build-vastai-exporter-recipe.yml@f995901eb7fbb1bf6d94fd75d1a8b69d8edfdcef
    permissions:
      contents: read
  release-readback:
    if: always() && needs.release-preflight.result == 'success'
    uses: cryptolabsza/dc-overview/.github/workflows/ci-image-readback-recipe.yml@98fc1d4be4e4a091cad8b5d5a2d5b3b7c5c57225
    permissions:
      contents: read
      packages: read
    needs:
    - release-preflight
    - publish-build
'on':
  push:
    branches:
    - main
    - master
    - develop
    - dev
    tags:
    - v*
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
