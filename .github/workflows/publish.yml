name: Publish verified Python release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag (vX.Y.Z)'
        required: true
        type: string
      version:
        description: 'Version matching the tag and pyproject.toml (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.repository }}-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install build
      - name: Validate published tag and pristine source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_publication.py context
      - name: Build once from the checked-out revision
        run: |
          mkdir "$RUNNER_TEMP/release-source" "$RUNNER_TEMP/release-dist"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-source"
          GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$RUNNER_TEMP/release-source" GITHUB_REF_NAME="$RELEASE_TAG" \
            python -m build "$RUNNER_TEMP/release-source" --outdir "$RUNNER_TEMP/release-dist"
      - name: Validate wheel and sdist metadata and retain checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_publication.py prepare --dist "$RUNNER_TEMP/release-dist" --plan "$RUNNER_TEMP/build-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-build
          path: |
            ${{ runner.temp }}/release-dist/*
            ${{ runner.temp }}/build-receipt.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload tool
        run: python -m pip install twine
      - name: Check GitHub uploader
        run: gh --version
      - uses: actions/download-artifact@v4
        with:
          name: python-release-build
          path: ${{ runner.temp }}/release-bundle
      - name: Publish and verify exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python scripts/release_publication.py publish \
            --dist "$RUNNER_TEMP/release-bundle/release-dist" \
            --plan "$RUNNER_TEMP/release-bundle/build-receipt.json" \
            --receipt "$RUNNER_TEMP/verified-publication.json"
      - name: Retain verified publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: verified-python-publication
          path: ${{ runner.temp }}/verified-publication.json
          if-no-files-found: error
          retention-days: 90
